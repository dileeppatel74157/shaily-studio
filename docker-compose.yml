services:
  postgres:
    image: postgres:16-alpine
    container_name: shaily-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shaily_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaily_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-shaily_studio_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaily_admin} -d ${POSTGRES_DB:-shaily_studio_dev}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shaily-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: shaily-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infrastructure/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:6333/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: shaily-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-shaily_admin}:${POSTGRES_PASSWORD:-shaily_secure_password_123}@postgres:5432/${POSTGRES_DB:-shaily_studio_dev}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      - JWT_SECRET=shaily-studio-default-jwt-secret-key-12345
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: development
    container_name: shaily-worker
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-shaily_admin}:${POSTGRES_PASSWORD:-shaily_secure_password_123}@postgres:5432/${POSTGRES_DB:-shaily_studio_dev}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_ENV=development
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, sys; pids = [p for p in os.listdir('/proc') if p.isdigit()]; sys.exit(0 if any(b'arq' in open(f'/proc/{p}/cmdline', 'rb').read() for p in pids) else 1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: development
    container_name: shaily-web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/core/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/config/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "const http = require('http'); const req = http.request({ host: 'localhost', port: 3000, path: '/', timeout: 2000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.end();" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
